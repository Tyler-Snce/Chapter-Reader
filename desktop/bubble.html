<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Chapter Reader bubble</title>
<style>
  :root {
    --accent: #6b4fd8;
    --panel: #1d1b22;
    --btn: #34303d;
    --btn-hover: #45404f;
    --text: #f4f1f8;
    --muted: #a8a2b3;
    --red: #d93a3a;
  }
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden;
    font: 13px/1.2 "Segoe UI", system-ui, sans-serif; color: var(--text); user-select: none; }
  #ball {
    position: absolute; left: 8px; top: 8px; width: 56px; height: 56px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 3px 10px rgba(0,0,0,.45), inset 0 0 0 2px rgba(255,255,255,.25);
    display: grid; place-items: center; cursor: pointer;
  }
  #ball:hover { filter: brightness(1.1); }
  #ball svg { width: 26px; height: 26px; display: block; }
  #title {
    position: absolute; left: 76px; right: 8px; top: 14px; height: 44px; display: none;
    background: var(--panel); border-radius: 10px; padding: 6px 10px; box-sizing: border-box;
    overflow: hidden; color: var(--muted); font-size: 12px;
  }
  #title b { display: block; color: var(--text); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #menu {
    position: absolute; left: 8px; right: 8px; top: 72px; display: none;
    background: var(--panel); border-radius: 14px; padding: 8px; box-sizing: border-box;
    box-shadow: 0 6px 18px rgba(0,0,0,.5);
  }
  body.open #menu, body.open #title { display: block; }
  .row { display: flex; gap: 6px; margin-bottom: 6px; }
  .row:last-child { margin-bottom: 0; }
  button {
    flex: 1; min-height: 38px; border: 0; border-radius: 9px; background: var(--btn); color: var(--text);
    font: inherit; font-size: 15px; cursor: pointer; padding: 4px 6px;
  }
  button:hover { background: var(--btn-hover); }
  button.wide { font-size: 13px; }
  button.quit { background: var(--red); font-weight: 600; font-size: 14px; }
  button.quit:hover { filter: brightness(1.1); }
  #rate { flex: 0 0 52px; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
  .hint { color: var(--muted); font-size: 11px; text-align: center; margin-top: 6px; }
</style>
</head>
<body>
<div id="ball" title="Click: play/pause. Right-click or hold: menu. Drag: move."></div>
<div id="title"><b id="chapter">Chapter Reader</b><span id="sub">Nothing loaded yet</span></div>
<div id="menu">
  <div class="row">
    <button class="wide" data-cmd="readBrowser">&#128214; Read this page</button>
    <button class="wide" data-cmd="paste">&#128203; Paste link</button>
  </div>
  <div class="row">
    <button data-cmd="prevch" title="Previous chapter">&#9198;</button>
    <button data-cmd="back" title="Back a paragraph">&#9194;</button>
    <button data-cmd="toggle" title="Play / pause" id="pp">&#9199;</button>
    <button data-cmd="fwd" title="Forward a paragraph">&#9193;</button>
    <button data-cmd="nextch" title="Next chapter">&#9197;</button>
  </div>
  <div class="row">
    <button data-cmd="slower" title="Slower">&minus;</button>
    <span id="rate">1.0&times;</span>
    <button data-cmd="faster" title="Faster">+</button>
    <button class="wide" data-cmd="openReader" style="flex:2">&#128196; Reading view</button>
  </div>
  <div class="row">
    <button class="wide" data-cmd="hideBubble">Hide bubble</button>
    <button class="quit" data-cmd="quit">&#10005; Quit</button>
  </div>
  <div class="hint">Hidden? Ctrl+Alt+B or the tray icon brings it back</div>
</div>

<script>
const { ipcRenderer } = require('electron');

const ICONS = {
  play: '<svg viewBox="0 0 24 24"><path fill="#fff" d="M9,6.2L18,12L9,17.8Z"/></svg>',
  pause: '<svg viewBox="0 0 24 24"><path fill="#fff" d="M7,6h3.6v12H7zM13.4,6H17v12h-3.6z"/></svg>',
  book: '<svg viewBox="0 0 24 24"><path fill="#fff" d="M4,4.5C4,3.67 4.67,3 5.5,3H11v16H5.5C4.67,19 4,19.67 4,20.5V4.5zM13,3h5.5c0.83,0 1.5,0.67 1.5,1.5v16c0,-0.83 -0.67,-1.5 -1.5,-1.5H13V3z"/></svg>',
  dots: '<svg viewBox="0 0 24 24"><path fill="#fff" d="M4.5,12a1.5,1.5 0,1 0,3,0a1.5,1.5 0,1 0,-3,0zM10.5,12a1.5,1.5 0,1 0,3,0a1.5,1.5 0,1 0,-3,0zM16.5,12a1.5,1.5 0,1 0,3,0a1.5,1.5 0,1 0,-3,0z"/></svg>',
};

let st = { hasChapter: false, playing: false, loading: false, rate: 1, title: '', status: '' };
let menuOpen = false;
const ball = document.getElementById('ball');

function render() {
  ball.innerHTML = st.loading ? ICONS.dots : (!st.hasChapter && !st.hasResume) ? ICONS.book : st.playing ? ICONS.pause : ICONS.play;
  document.getElementById('rate').textContent = (st.rate || 1).toFixed(1) + '×';
  document.getElementById('chapter').textContent = st.title || 'Chapter Reader';
  document.getElementById('sub').textContent = st.status || (st.hasChapter ? (st.progress || '') : st.hasResume ? 'Click to continue: ' + (st.resumeTitle || 'your last chapter') : 'Open a chapter in your browser, then Read this page');
}

const cmd = (type, extra) => ipcRenderer.send('cmd', Object.assign({ type }, extra || {}));

document.querySelectorAll('#menu button').forEach((b) => {
  b.addEventListener('click', () => cmd(b.dataset.cmd));
});

// Click = play/pause (or read the page if nothing is loaded). Hold or right-click = menu. Drag = move.
let pressed = false, dragging = false, held = false, sx = 0, sy = 0, holdTimer = null;
ball.addEventListener('mousedown', (e) => {
  if (e.button !== 0) return;
  pressed = true; dragging = false; held = false; sx = e.screenX; sy = e.screenY;
  holdTimer = setTimeout(() => { held = true; cmd('menu'); }, 450);
});
document.addEventListener('mousemove', (e) => {
  if (!pressed) return;
  const dx = e.screenX - sx, dy = e.screenY - sy;
  if (!dragging && Math.hypot(dx, dy) > 5) {
    dragging = true; clearTimeout(holdTimer);
    ipcRenderer.send('drag-start');
  }
  if (dragging) ipcRenderer.send('drag', { dx, dy });
});
document.addEventListener('mouseup', () => {
  if (!pressed) return;
  pressed = false; clearTimeout(holdTimer);
  if (dragging) { ipcRenderer.send('drag-end'); return; }
  if (held) return;
  if (menuOpen) { cmd('menu', { open: false }); return; }
  cmd(st.hasChapter || st.hasResume ? 'toggle' : 'readBrowser');
});
ball.addEventListener('contextmenu', (e) => { e.preventDefault(); cmd('menu'); });

ipcRenderer.on('state', (_e, s) => { st = s; render(); });
ipcRenderer.on('menu', (_e, open) => { menuOpen = open; document.body.classList.toggle('open', open); });
render();
</script>
</body>
</html>
