name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'desktop/**'
      - 'toolkit/**'
      - '.github/workflows/desktop.yml'
      - '.github/workflows/toolkit-*.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip -d "$HOME/gradle"
          echo "$HOME/gradle/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Check Android tools
        run: |
          { echo "ANDROID_HOME=$ANDROID_HOME"; ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" || true; } | tee "$RUNNER_TEMP/setup.log"

      - name: Build the app
        shell: bash
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk ChapterReader.apk

      - uses: actions/upload-artifact@v5
        with:
          name: ChapterReader
          path: ChapterReader.apk

      - name: Publish download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" ChapterReader.apk \
            --repo "${{ github.repository }}" \
            --title "Chapter Reader build ${{ github.run_number }}" \
            --notes "Tap ChapterReader.apk below to download." \
            --latest

      - name: Save log for troubleshooting
        if: failure()
        shell: bash
        run: |
          mkdir -p /tmp/logs && cd /tmp/logs
          cat "$RUNNER_TEMP/setup.log" "$RUNNER_TEMP/build.log" > build.log 2>/dev/null || echo "no log (failed before build)" > build.log
          git init -q -b logs
          git config user.name "build-bot"; git config user.email "build-bot@users.noreply.github.com"
          git add build.log && git commit -qm "Build log ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" logs
