name: Build Staff Toolkit phone

on:
  push:
    branches: [main]
    paths:
      - 'toolkit/android/**'
      - '.github/workflows/toolkit-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: toolkit/android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip -d "$HOME/gradle"
          echo "$HOME/gradle/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build the app
        shell: bash
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/build.log"
          cp app/build/outputs/apk/release/app-release.apk StaffToolkit.apk

      - name: Publish download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete toolkit-android --repo "${{ github.repository }}" --yes --cleanup-tag || true
          gh release create toolkit-android StaffToolkit.apk \
            --repo "${{ github.repository }}" \
            --title "Staff Toolkit for Android" \
            --notes "Tap StaffToolkit.apk below to download. Build ${{ github.run_number }}." \
            --latest=false

      - name: Save log for troubleshooting
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/logs && cd /tmp/logs
          cp "$RUNNER_TEMP/build.log" build.log 2>/dev/null || echo "no log" > build.log
          git init -q -b logs-toolkit-android
          git config user.name "build-bot"; git config user.email "build-bot@users.noreply.github.com"
          git add build.log && git commit -qm "Toolkit phone build log ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" logs-toolkit-android
