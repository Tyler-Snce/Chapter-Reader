name: Upload test
on:
  push:
    branches: [uptest]
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-24.04
    steps:
      - name: Test
        run: |
          set +e
          echo "Staff Toolkit upload test" > t.txt
          {
          echo "== gofile upload"; curl -s -F "file=@t.txt" https://upload.gofile.io/uploadfile; echo
          echo "== gofile servers"; curl -s https://api.gofile.io/servers | head -c 600; echo
          } > out.txt 2>&1
          cat out.txt
          mkdir o && cp out.txt o/ && cd o && git init -q -b logs-up && git config user.name bot && git config user.email bot@users.noreply.github.com && git add . && git commit -qm o && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" logs-up
