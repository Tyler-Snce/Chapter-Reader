name: OCR debug
on:
  push:
    branches: [ocr-debug]
permissions:
  contents: write
jobs:
  ocr:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run Windows OCR on the sample
        shell: pwsh
        run: |
          $img = (Resolve-Path debug/page.png).Path
          $out = ("1`t" + $img) | powershell.exe -NoProfile -ExecutionPolicy Bypass -File desktop/ocr.ps1 2>&1 | Out-String
          Set-Content -Path ocr-out.txt -Value $out
      - name: Save output
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/o && cp ocr-out.txt /tmp/o/ 2>/dev/null || echo none > /tmp/o/ocr-out.txt
          cd /tmp/o && git init -q -b logs-ocr && git config user.name bot && git config user.email bot@users.noreply.github.com
          git add . && git commit -qm out && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" logs-ocr
